name: Build Cefrium with built-in AC3/EAC3
on:
  workflow_dispatch:
  push:
    branches: [codecs/ac3-eac3]
    paths:
      - .github/workflows/native-codecs.yml
      - scripts/native-build.sh
      - scripts/native-ffmpeg.sh
      - native/**
permissions:
  contents: read
concurrency:
  group: lampa-vps
  cancel-in-progress: false
jobs:
  codecs:
    if: github.repository == 'ARST113/lampa-chromium-android' && (github.ref == 'refs/heads/codecs/ac3-eac3' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, lampa]
    timeout-minutes: 1440
    env:
      JAVA_HOME: /usr/lib/jvm/java-25-openjdk-amd64
      ANDROID_HOME: /opt/lampa-ci/android-sdk
      ANDROID_SDK_ROOT: /opt/lampa-ci/android-sdk
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned sources
        run: |
          mkdir -p artifacts
          bash scripts/native-prepare.sh 2>&1 | tee artifacts/prepare.log
      - name: Compile ARM64 engine with FFmpeg AC3/EAC3 decoders
        run: bash scripts/native-build.sh arm64
      - name: Package Lampa and built-in media diagnostics
        run: |
          bash scripts/build-frontend.sh
          bash scripts/generate-media.sh
      - name: Build ARM64 browser APK
        run: |
          aar="$PWD/artifacts/native-arm64/cefrium-sdk-arm64-ac3.aar"
          sha=$(python3 -c 'import json; print(json.load(open("artifacts/native-arm64/manifest.json"))["sha256"])')
          bash scripts/gradle.sh :app:assembleDebug -Pabi=arm64-v8a -PcefriumAar="$aar" -PcefriumSha256="$sha"
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/lampa-software-ac3-arm64.apk
      - name: Artifact hashes
        if: always()
        run: find artifacts -maxdepth 1 -name '*.apk' -exec sha256sum {} \; > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lampa-software-ac3-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
