plugins { id 'com.android.application'; id 'com.cefrium' }
android {
    namespace 'dev.lampa.cefrium'
    compileSdk 37
    defaultConfig {
        applicationId 'dev.lampa.cefrium.probe'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1-cefrium-0.9.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters(project.findProperty('abi') ?: 'x86_64') }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress 'dat', 'pak', 'bin' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
configurations.configureEach { exclude group: 'com.google.guava', module: 'listenablefuture' }
dependencies {
    implementation 'com.cefrium:cefrium-sdk:0.9.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.browser:browser:1.8.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('verifyCefriumSdk') {
    doLast {
        def expected = new groovy.json.JsonSlurper().parse(rootProject.file('dependencies/cefrium.json'))
        def sdk = configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'com.cefrium' && it.name == 'cefrium-sdk'
        }
        if (sdk == null) throw new GradleException('Cefrium SDK artifact is missing')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        sdk.file.withInputStream { stream ->
            def checked = new java.security.DigestInputStream(stream, digest)
            checked.transferTo(java.io.OutputStream.nullOutputStream())
        }
        def actual = digest.digest().encodeHex().toString()
        if (sdk.moduleVersion.id.version != expected.version || actual != expected.sdk_sha256) {
            throw new GradleException("Cefrium SDK revision/checksum mismatch: ${actual}")
        }
        println "Verified Cefrium ${expected.version}: ${actual}"
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyCefriumSdk' }
